<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="78" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#8e2157">DATA ALL AROUND — Sorting &amp; Counting Shop</text>
  <text x="320" y="103" text-anchor="middle" font-family="Arial" font-size="13" fill="#8a6f7c">Sort every item, count the baskets, read the data!</text>
  <!-- item pile -->
  <g font-size="26" text-anchor="middle">
    <text x="85" y="170">🍎</text><text x="120" y="150">🐱</text><text x="95" y="200">🔺</text><text x="130" y="185">🍌</text><text x="80" y="130">🐶</text>
    <text x="60" y="245" font-family="Arial" font-size="12" fill="#8a6f7c">mixed pile</text>
  </g>
  <path d="M 60 215 Q 105 240 150 215" stroke="#e0b5cb" stroke-width="3" fill="none"/>
  <!-- three baskets -->
  <g text-anchor="middle">
    <rect x="190" y="120" width="130" height="130" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="255" y="155" font-size="15" fill="#8e2157" font-weight="bold" font-family="Arial">Fruits 🍎</text>
    <text x="255" y="200" font-size="26">🍎🍌🍇</text>
    <text x="255" y="235" font-family="Arial" font-size="16" fill="#8e2157" font-weight="bold">////̸ = 5</text>
    <rect x="340" y="120" width="130" height="130" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="405" y="155" font-size="15" fill="#8e2157" font-weight="bold" font-family="Arial">Animals 🐾</text>
    <text x="405" y="200" font-size="26">🐶🐱🐰</text>
    <text x="405" y="235" font-family="Arial" font-size="16" fill="#8e2157" font-weight="bold">/// = 3</text>
    <rect x="490" y="120" width="130" height="130" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="555" y="155" font-size="15" fill="#8e2157" font-weight="bold" font-family="Arial">Shapes 🔷</text>
    <text x="555" y="200" font-size="26">🔺⬛⚪</text>
    <text x="555" y="235" font-family="Arial" font-size="16" fill="#8e2157" font-weight="bold">//// = 4</text>
  </g>
  <!-- chart -->
  <rect x="190" y="272" width="430" height="60" rx="12" fill="#ffffff" stroke="#f0dbe6" stroke-width="2"/>
  <text x="215" y="308" font-family="Arial" font-size="15" fill="#8e2157" font-weight="bold">SHOP BOARD:</text>
  <text x="360" y="308" font-family="Arial" font-size="16" fill="#8e2157" letter-spacing="2">🍎 5   🐾 3   🔷 4   → total 12 items</text>
  <text x="320" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Data is all around us — collect it, sort it, count it, use it!</text>
</svg>

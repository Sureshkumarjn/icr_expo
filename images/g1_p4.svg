<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8e2157">SPOT THE BUG — Silly Robot Poster</text>
  <line x1="60" y1="95" x2="580" y2="95" stroke="#f0dbe6" stroke-width="2"/>
  <!-- silly robot -->
  <g text-anchor="middle">
    <circle cx="200" cy="185" r="55" fill="#e8e2e6" stroke="#8e2157" stroke-width="3"/>
    <circle cx="182" cy="172" r="8" fill="#8e2157"/>
    <circle cx="222" cy="172" r="8" fill="#8e2157"/>
    <path d="M 178 200 Q 202 218 226 198" stroke="#8e2157" stroke-width="3" fill="none"/>
    <rect x="192" y="120" width="16" height="18" fill="#a63a6e"/>
    <circle cx="200" cy="115" r="10" fill="#e2506a"/>
    <text x="200" y="145" font-size="24">🎩</text>
    <rect x="140" y="250" width="120" height="80" rx="16" fill="#e8e2e6" stroke="#8e2157" stroke-width="3"/>
    <text x="200" y="300" font-size="30">🧦</text>
  </g>
  <!-- bug marker -->
  <circle cx="255" cy="285" r="26" fill="none" stroke="#e2506a" stroke-width="4" stroke-dasharray="7 5"/>
  <text x="255" y="293" text-anchor="middle" font-size="22">🐛</text>
  <!-- magnifier -->
  <circle cx="330" cy="270" r="34" fill="#ffffff" opacity=".85" stroke="#8e2157" stroke-width="5"/>
  <line x1="355" y1="295" x2="390" y2="330" stroke="#8e2157" stroke-width="8" stroke-linecap="round"/>
  <!-- fix cards -->
  <g text-anchor="middle">
    <rect x="420" y="130" width="160" height="52" rx="12" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="500" y="166" font-size="26">🪥 toothbrush</text>
    <rect x="420" y="196" width="160" height="52" rx="12" fill="#eafaf1" stroke="#2fae62" stroke-width="3"/>
    <text x="500" y="232" font-size="26">👟 shoes ✓</text>
    <rect x="420" y="262" width="160" height="52" rx="12" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="500" y="298" font-size="26">🧢 cap</text>
  </g>
  <text x="320" y="368" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Find the bug → paste the fix → robot sensible again!</text>
</svg>

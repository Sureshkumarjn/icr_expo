  <!-- grid 4x4 -->
  <g>
    <rect x="150" y="115" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="222" y="115" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="294" y="115" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="366" y="115" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="150" y="187" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="222" y="187" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="294" y="187" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="366" y="187" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="150" y="259" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="222" y="259" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="294" y="259" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <rect x="366" y="259" width="72" height="72" fill="#fff" stroke="#e8c6d8" stroke-width="2"/>
    <text x="186" y="306" text-anchor="middle" font-size="40">🐝</text>
    <text x="330" y="162" text-anchor="middle" font-size="40">🌸</text>
    <text x="258" y="235" text-anchor="middle" font-size="22" fill="#f0dbe6">↑</text>
    <text x="330" y="235" text-anchor="middle" font-size="22" fill="#f0dbe6">→</text>
  </g>
  <!-- bee-bot controller -->
  <rect x="480" y="120" width="110" height="200" rx="16" fill="#8e2157"/>
  <text x="535" y="150" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">BEE-BOT</text>
  <g font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle">
    <rect x="515" y="165" width="40" height="34" rx="8" fill="#a63a6e"/><text x="535" y="189">⬆</text>
    <rect x="487" y="207" width="40" height="34" rx="8" fill="#a63a6e"/><text x="507" y="231">↰</text>
    <rect x="543" y="207" width="40" height="34" rx="8" fill="#a63a6e"/><text x="563" y="231">↱</text>
    <rect x="515" y="249" width="40" height="34" rx="8" fill="#a63a6e"/><text x="535" y="273">⬇</text>
    <rect x="497" y="291" width="76" height="22" rx="11" fill="#7CFC9B"/><text x="535" y="307" font-size="12" fill="#4f1130" font-weight="bold">GO ▶</text>

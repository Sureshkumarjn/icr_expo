<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="78" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#8e2157">OUR DATA STORY — Live Bar Graph</text>
  <text x="320" y="103" text-anchor="middle" font-family="Arial" font-size="13" fill="#8a6f7c">Which fruit does the class like best? Vote and watch it grow!</text>
  <!-- graph -->
  <line x1="90" y1="310" x2="590" y2="310" stroke="#f0dbe6" stroke-width="3"/>
  <g text-anchor="middle">
    <rect x="120" y="170" width="64" height="140" rx="8" fill="#a63a6e"/>
    <text x="152" y="160" font-family="Arial" font-size="16" fill="#8e2157" font-weight="bold">7</text>
    <text x="152" y="336" font-size="22">🍎</text>
    <text x="152" y="356" font-family="Arial" font-size="12" fill="#8a6f7c">Apple</text>
    <rect x="230" y="215" width="64" height="95" rx="8" fill="#c05a8a"/>
    <text x="262" y="205" font-family="Arial" font-size="16" fill="#8e2157" font-weight="bold">5</text>
    <text x="262" y="336" font-size="22">🍌</text>
    <text x="262" y="356" font-family="Arial" font-size="12" fill="#8a6f7c">Banana</text>
    <rect x="340" y="140" width="64" height="170" rx="8" fill="#8e2157"/>
    <text x="372" y="130" font-family="Arial" font-size="16" fill="#8e2157" font-weight="bold">9 🏆</text>
    <text x="372" y="336" font-size="22">🍇</text>
    <text x="372" y="356" font-family="Arial" font-size="12" fill="#8a6f7c">Grapes</text>
    <rect x="450" y="245" width="64" height="65" rx="8" fill="#d98ab0"/>
    <text x="482" y="235" font-family="Arial" font-size="16" fill="#8e2157" font-weight="bold">3</text>
    <text x="482" y="336" font-size="22">🥭</text>
    <text x="482" y="356" font-family="Arial" font-size="12" fill="#8a6f7c">Mango</text>
  </g>
  <!-- sticky notes on tallest bar -->
  <g transform="rotate(-8 385 155)">
    <rect x="370" y="112" width="30" height="26" fill="#ffd24d"/>
  </g>
  <g transform="rotate(10 350 160)">
    <rect x="336" y="118" width="28" height="24" fill="#7cf2c0"/>
  </g>
  <text x="320" y="385" text-anchor="middle" font-family="Arial" font-size="13" fill="#8a6f7c">Sticky votes added live — the tallest bar tells the data story!</text>
</svg>

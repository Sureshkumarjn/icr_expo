<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8e2157">MY COMPUTER WORKS — Input · Process · Output</text>
  <line x1="60" y1="95" x2="580" y2="95" stroke="#f0dbe6" stroke-width="2"/>
  <!-- input -->
  <g text-anchor="middle">
    <rect x="60" y="150" width="120" height="120" rx="16" fill="#fff" stroke="#a63a6e" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="120" y="205" font-size="38">2 + 3</text>
    <text x="120" y="255" font-family="Arial" font-size="13" fill="#8e2157" font-weight="bold">INPUT 🖐️</text>
  </g>
  <text x="200" y="215" font-size="26" fill="#a63a6e" text-anchor="middle">⬅️</text>
  <!-- computer -->
  <rect x="220" y="115" width="200" height="190" rx="20" fill="#8e2157"/>
  <text x="320" y="150" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff" font-weight="bold">💻 COMPUTER</text>
  <circle cx="320" cy="205" r="26" fill="#5a2c42"/>
  <circle cx="320" cy="205" r="14" fill="#ffd24d"/>
  <text x="320" y="255" text-anchor="middle" font-family="Arial" font-size="13" fill="#f7e9f0">thinking…</text>
  <rect x="255" y="270" width="130" height="24" rx="12" fill="#a63a6e"/>
  <text x="320" y="287" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">PROCESS 🧠</text>
  <text x="440" y="215" font-size="26" fill="#a63a6e" text-anchor="middle">→</text>
  <!-- output -->
  <g text-anchor="middle">
    <rect x="460" y="150" width="120" height="120" rx="16" fill="#fff" stroke="#a63a6e" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="520" y="205" font-size="38" fill="#8e2157" font-weight="bold">= 5 ⭐</text>
    <text x="520" y="255" font-family="Arial" font-size="13" fill="#8e2157" font-weight="bold">OUTPUT 🖨️</text>
  </g>
  <text x="320" y="358" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Feed the input → computer thinks → read the output!</text>
</svg>

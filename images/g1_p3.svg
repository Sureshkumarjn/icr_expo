<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8e2157">WHAT HAPPENS NEXT? — Pattern Machine</text>
  <line x1="60" y1="95" x2="580" y2="95" stroke="#f0dbe6" stroke-width="2"/>
  <!-- machine -->
  <rect x="70" y="115" width="330" height="220" rx="20" fill="#8e2157"/>
  <rect x="95" y="140" width="280" height="120" rx="12" fill="#ffffff"/>
  <g font-size="46" text-anchor="middle">
    <text x="145" y="215">🌰</text><text x="205" y="215" font-size="26" fill="#a63a6e">→</text>
    <text x="265" y="215">🌱</text><text x="325" y="215" font-size="26" fill="#a63a6e">→</text>
    <text x="370" y="212" font-size="34" fill="#c9a0b5">?</text>
  </g>
  <rect x="120" y="278" width="230" height="36" rx="18" fill="#a63a6e"/>
  <text x="235" y="302" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">GROWING SEQUENCE</text>
  <circle cx="345" cy="296" r="14" fill="#ffd24d"/>
  <!-- choice cards -->
  <g text-anchor="middle">
    <rect x="430" y="125" width="150" height="55" rx="12" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="505" y="163" font-size="30">🌿</text>
    <rect x="430" y="196" width="150" height="55" rx="12" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="505" y="234" font-size="30">🥀</text>
    <rect x="430" y="267" width="150" height="55" rx="12" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="505" y="305" font-size="30">🌰</text>
  </g>
  <text x="320" y="368" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Study the pattern — predict the next card!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8e2157">REPEAT, REPEAT, REPEAT — Traffic Light Loop</text>
  <line x1="60" y1="95" x2="580" y2="95" stroke="#f0dbe6" stroke-width="2"/>
  <!-- traffic light -->
  <rect x="120" y="110" width="130" height="270" rx="22" fill="#4f1130"/>
  <circle cx="185" cy="165" r="38" fill="#ff4d5e"/>
  <circle cx="185" cy="165" r="38" fill="none" stroke="#ff4d5e" stroke-width="10" opacity=".45"/>
  <circle cx="185" cy="250" r="38" fill="#3a1f2c"/>
  <circle cx="185" cy="335" r="38" fill="#3a1f2c"/>
  <!-- pole -->
  <rect x="178" y="380" width="14" height="10" fill="#4f1130"/>
  <!-- loop code card -->
  <rect x="300" y="115" width="290" height="160" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
  <g font-family="Courier New" font-size="16" font-weight="bold">
    <text x="325" y="150" fill="#8e2157">while (true) {</text>
    <text x="345" y="178" fill="#8e2157">🔴 red; wait;</text>
    <text x="345" y="206" fill="#8e2157">🟢 green; wait;</text>
    <text x="345" y="234" fill="#8e2157">🟡 yellow; wait;</text>
    <text x="325" y="262" fill="#8e2157">}</text>
  </g>
  <rect x="480" y="225" width="96" height="30" rx="8" fill="#8e2157"/>
  <text x="528" y="245" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff" font-weight="bold">REPEAT ♻️</text>
  <!-- loop counter -->
  <rect x="300" y="295" width="290" height="52" rx="12" fill="#ffffff" stroke="#f0dbe6" stroke-width="2"/>
  <text x="325" y="327" font-family="Arial" font-size="15" fill="#8a6f7c">loops completed:</text>
  <text x="560" y="330" text-anchor="end" font-family="Arial" font-size="24" fill="#8e2157" font-weight="bold">1,247 ♻️</text>
  <text x="320" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Same pattern, forever — write it once, loop it forever!</text>
</svg>

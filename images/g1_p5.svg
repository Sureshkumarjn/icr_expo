<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="78" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#8e2157">USING DATA — Class Favourite Tally Wall</text>
  <text x="320" y="104" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Which animal does our class like best?</text>
  <!-- 4 columns -->
  <g text-anchor="middle">
    <rect x="60" y="125" width="120" height="200" rx="14" fill="#f7e9f0" stroke="#e0b5cb" stroke-width="2"/>
    <text x="120" y="165" font-size="34">🐶</text>
    <text x="120" y="235" font-family="Arial" font-size="24" fill="#8e2157" font-weight="bold">////̸ /</text>
    <text x="120" y="300" font-family="Arial" font-size="15" fill="#8e2157" font-weight="bold">6</text>
    <rect x="200" y="125" width="120" height="200" rx="14" fill="#f7e9f0" stroke="#e0b5cb" stroke-width="2"/>
    <text x="260" y="165" font-size="34">🐱</text>
    <text x="260" y="235" font-family="Arial" font-size="24" fill="#8e2157" font-weight="bold">////̸ //</text>
    <text x="260" y="300" font-family="Arial" font-size="15" fill="#8e2157" font-weight="bold">7</text>
    <rect x="340" y="125" width="120" height="200" rx="14" fill="#f7e9f0" stroke="#e0b5cb" stroke-width="2"/>
    <text x="400" y="165" font-size="34">🐰</text>
    <text x="400" y="235" font-family="Arial" font-size="24" fill="#8e2157" font-weight="bold">////</text>
    <text x="400" y="300" font-family="Arial" font-size="15" fill="#8e2157" font-weight="bold">4</text>
    <rect x="480" y="125" width="120" height="200" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="3"/>
    <text x="540" y="165" font-size="34">🦁</text>
    <text x="540" y="235" font-family="Arial" font-size="24" fill="#8e2157" font-weight="bold">////̸ ///̸</text>
    <text x="540" y="300" font-family="Arial" font-size="15" fill="#8e2157" font-weight="bold">9 🏆</text>
  </g>
  <text x="320" y="358" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Every vote = one tally mark. The tallest column answers the question!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="76" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#8e2157">🔍 DATA DETECTIVE — read the chart, then answer the questions</text>
  <text x="320" y="100" text-anchor="middle" font-family="Arial" font-size="13" fill="#8a6f7c">🔑 Key: 1 picture = 1 creature</text>
  <!-- 4 picture-chart baskets -->
  <g text-anchor="middle" font-family="Arial">
    <rect x="55" y="115" width="125" height="150" rx="14" fill="#f7e9f0" stroke="#e0b5cb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="117" y="145" font-size="14" font-weight="bold" fill="#8e2157">🐞 Ladybird</text>
    <text x="117" y="195" font-size="26" fill="#8e2157">🐞🐞</text>
    <text x="117" y="245" font-size="15" font-weight="bold" fill="#8e2157">2</text>

    <rect x="195" y="115" width="125" height="150" rx="14" fill="#f7e9f0" stroke="#e0b5cb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="257" y="145" font-size="14" font-weight="bold" fill="#8e2157">🦋 Butterfly</text>
    <text x="257" y="185" font-size="22" fill="#8e2157">🦋🦋🦋</text>
    <text x="257" y="215" font-size="22" fill="#8e2157">🦋🦋</text>
    <text x="257" y="245" font-size="15" font-weight="bold" fill="#8e2157">5</text>

    <rect x="335" y="115" width="125" height="150" rx="14" fill="#f7e9f0" stroke="#e0b5cb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="397" y="145" font-size="14" font-weight="bold" fill="#8e2157">🐌 Snail</text>
    <text x="397" y="185" font-size="22" fill="#8e2157">🐌🐌🐌</text>
    <text x="397" y="215" font-size="22" fill="#8e2157">🐌</text>
    <text x="397" y="245" font-size="15" font-weight="bold" fill="#8e2157">4</text>

    <rect x="475" y="115" width="125" height="150" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="537" y="145" font-size="14" font-weight="bold" fill="#8e2157">🐝 Bee</text>
    <text x="537" y="195" font-size="26" fill="#8e2157">🐝🐝🐝</text>
    <text x="537" y="245" font-size="15" font-weight="bold" fill="#8e2157">3</text>
  </g>
  <!-- question + options -->
  <g text-anchor="middle" font-family="Arial">
    <text x="320" y="295" font-size="14" font-weight="bold" fill="#8e2157">🔍 Question 1 of 6: Which creature did we see the MOST?</text>
    <rect x="70" y="310" width="115" height="32" rx="16" fill="#fff" stroke="#a63a6e" stroke-width="2"/>
    <text x="127" y="331" font-size="13" fill="#8e2157">🐞 Ladybird</text>
    <rect x="200" y="310" width="115" height="32" rx="16" fill="#fff" stroke="#a63a6e" stroke-width="2"/>
    <text x="257" y="331" font-size="13" fill="#8e2157">🦋 Butterfly</text>
    <rect x="330" y="310" width="105" height="32" rx="16" fill="#fff" stroke="#a63a6e" stroke-width="2"/>
    <text x="382" y="331" font-size="13" fill="#8e2157">🐌 Snail</text>
    <rect x="450" y="310" width="95" height="32" rx="16" fill="#fff" stroke="#a63a6e" stroke-width="2"/>
    <text x="497" y="331" font-size="13" fill="#8e2157">🐝 Bee</text>
  </g>
  <text x="320" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#8a6f7c">Count the pictures → compare the rows → answer like a data detective!</text>
</svg>

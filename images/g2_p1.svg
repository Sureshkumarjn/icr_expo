<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8e2157">PRECISE ALGORITHMS — Sandwich Robot Chef</text>
  <line x1="60" y1="95" x2="580" y2="95" stroke="#f0dbe6" stroke-width="2"/>
  <!-- chef -->
  <g text-anchor="middle">
    <text x="140" y="220" font-size="90">👨‍🍳</text>
    <rect x="80" y="240" width="120" height="34" rx="17" fill="#8e2157"/>
    <text x="140" y="262" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">FOLLOWS EVERY WORD!</text>
  </g>
  <!-- sandwich steps -->
  <g font-family="Arial" text-anchor="middle">
    <rect x="240" y="115" width="360" height="36" rx="10" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="420" y="139" font-size="15" fill="#8e2157">1. Take 2 bread slices 🍞</text>
    <rect x="240" y="158" width="360" height="36" rx="10" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="420" y="182" font-size="15" fill="#8e2157">2. Open the jam jar 🫙</text>
    <rect x="240" y="201" width="360" height="36" rx="10" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="420" y="225" font-size="15" fill="#8e2157">3. Spread jam with the knife 🥄</text>
    <rect x="240" y="244" width="360" height="36" rx="10" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2"/>
    <text x="420" y="268" font-size="15" fill="#8e2157">4. Cover with slice 2 🍞</text>
    <rect x="240" y="287" width="360" height="36" rx="10" fill="#eafaf1" stroke="#2fae62" stroke-width="2"/>
    <text x="420" y="311" font-size="15" fill="#2fae62" font-weight="bold">5. Serve the sandwich 🍽️ ✓ precise!</text>
  </g>
  <text x="320" y="358" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a6f7c">Vague steps make a mess — precision wins!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="86" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8e2157">ALGORITHM WALL — Washing Hands</text>
  <line x1="60" y1="102" x2="580" y2="102" stroke="#f0dbe6" stroke-width="2"/>

  <g font-family="Arial" text-anchor="middle">
    <rect x="50" y="130" width="126" height="130" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2.5"/>
    <text x="113" y="192" font-size="48">🚿</text><text x="113" y="236" font-size="14" fill="#8e2157" font-weight="bold">1. Wet hands</text>
    <text x="190" y="202" font-size="26" fill="#a63a6e">→</text>
    <rect x="203" y="130" width="126" height="130" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2.5"/>
    <text x="266" y="192" font-size="48">🧼</text><text x="266" y="236" font-size="14" fill="#8e2157" font-weight="bold">2. Apply soap</text>
    <text x="343" y="202" font-size="26" fill="#a63a6e">→</text>
    <rect x="356" y="130" width="126" height="130" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2.5"/>
    <text x="419" y="192" font-size="48">🙌</text><text x="419" y="236" font-size="14" fill="#8e2157" font-weight="bold">3. Scrub well</text>
    <text x="496" y="202" font-size="26" fill="#a63a6e">→</text>
    <rect x="509" y="130" width="126" height="130" rx="14" fill="#f7e9f0" stroke="#a63a6e" stroke-width="2.5"/>
    <text x="572" y="192" font-size="48">✨</text><text x="572" y="236" font-size="14" fill="#8e2157" font-weight="bold">4. Clean hands!</text>
  </g>

  <rect x="120" y="292" width="400" height="44" rx="22" fill="#8e2157"/>
  <text x="320" y="320" text-anchor="middle" font-family="Arial" font-size="15" fill="#ffffff" font-weight="bold">first → next → then → last</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fdf4f8"/>
  <rect x="30" y="40" width="580" height="320" rx="18" fill="#ffffff" stroke="#f0dbe6" stroke-width="3"/>
  <text x="320" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8e2157">ANIMAL ANIMATIONS — Scratch Stage</text>
  <line x1="60" y1="95" x2="580" y2="95" stroke="#f0dbe6" stroke-width="2"/>
  <!-- scratch stage -->
  <rect x="60" y="112" width="320" height="220" rx="12" fill="#ffffff" stroke="#8e2157" stroke-width="7"/>
  <text x="80" y="136" font-family="Arial" font-size="12" fill="#8e2157" font-weight="bold">hops: 6</text>
  <text x="360" y="136" text-anchor="end" font-family="Arial" font-size="12" fill="#8a6f7c" font-weight="bold">Scratch STAGE</text>
  <text x="110" y="300" font-size="52">🐸</text>
  <ellipse cx="240" cy="308" rx="26" ry="7" fill="#e8c6d8" opacity=".6"/>
  <text x="240" y="296" font-size="44" opacity=".55">🐸</text>
  <text x="345" y="288" font-size="36" opacity=".3">🐸</text>
  <!-- green flag -->
  <circle cx="80" cy="352" r="17" fill="#16a34a"/>
  <text x="80" y="358" text-anchor="middle" font-size="14" fill="#fff">⚑</text>
  <text x="105" y="357" font-family="Arial" font-size="13" fill="#8a6f7c">GREEN FLAG — run!</text>
  <!-- blocks palette -->
  <g font-family="Arial" font-size="13" font-weight="bold">
    <rect x="420" y="108" width="180" height="34" rx="9" fill="#c88a00"/><text x="432" y="130" fill="#fff">⚑ when clicked</text>
    <rect x="420" y="148" width="180" height="34" rx="9" fill="#cf8b17"/><text x="432" y="170" fill="#fff">⟳ forever</text>
    <rect x="420" y="188" width="180" height="34" rx="9" fill="#4c97ff"/><text x="432" y="210" fill="#fff">→ move 10 steps</text>
    <rect x="420" y="228" width="180" height="34" rx="9" fill="#9966ff"/><text x="432" y="250" fill="#fff">👒 next costume</text>
    <rect x="420" y="268" width="180" height="34" rx="9" fill="#cf8b17"/><text x="432" y="290" fill="#fff">⏱ wait 0.2 secs</text>
    <rect x="420" y="308" width="180" height="34" rx="9" fill="#cf63cf"/><text x="432" y="330" fill="#fff">🔊 start sound ribbit</text>
  </g>
</svg>
